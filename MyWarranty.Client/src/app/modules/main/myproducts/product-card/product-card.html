<div class="product-card" (click)="onView()">

    <div class="pc-icon">
        <i [class]="'bi ' + getCategoryIcon(categoryText)"></i>
    </div>

    <div class="pc-main">
        <div class="pc-name">{{ nameText }}</div>
        <div class="pc-sub">{{ productSubText }}</div>
    </div>

    <div class="pc-col">
        <span class="pc-label">Category</span>
        {{ categoryText }}
    </div>

    <div class="pc-col">
        <span class="pc-label">Warranty Ends</span>
        {{ warrantyEndDateText }}
        <span class="pc-days" *ngIf="hasWarrantyEndDate && status !== 'Expired'">{{ daysRemaining }} days left</span>
        <span class="pc-days danger" *ngIf="hasWarrantyEndDate && status === 'Expired'">Expired {{ -daysRemaining }}d ago</span>
    </div>

    <span class="status-pill" [class.active]="status === 'Active'" [class.expiring-soon]="status === 'Expiring Soon'"
        [class.expired]="status === 'Expired'">{{ hasWarrantyEndDate ? status : 'Unknown' }}</span>

    
        
        
            <button class="button-style" type="button" (click)="onView()"><i class="bi bi-eye"></i> View</button>
            <button class="button-style" type="button" (click)="$event.stopPropagation();onDelete()"><i class="bi bi-trash"></i> Delete</button>
          
</div>
