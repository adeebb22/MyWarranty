<main class="main">

  <!-- DASHBOARD CONTENT -->
  <ng-container *ngIf="!isDetailOpen && !showForm">

    <header class="page-header">
      <div>
        <h1>Good morning 👋</h1>
        <p>{{ products.length }} products tracked</p>
      </div>

      <button
        class="btn-gold"
        type="button"
        (click)="onAddProduct()">

        <i class="bi bi-plus-lg"></i>
        Add Product

      </button>
    </header>


    <section class="stats-grid">

      <app-stat-card
        *ngFor="let stat of stats"
        [stat]="stat">
      </app-stat-card>

    </section>


    <div
      class="alert-banner"
      *ngIf="expiringSoonCount > 0">

      <span>
        <i class="bi bi-exclamation-triangle"></i>
        {{ expiringSoonCount }} warranty expiring within 30 days
      </span>

      <a routerLink="/expiring-soon">
        View all →
      </a>

    </div>


    <section class="recent-product">

      <h2>Recent Products</h2>

      <div class="product-card">

        <app-product-card
          *ngFor="let product of recentProducts"
          [product]="product"
          (viewDetails)="onViewDetails($event)"
          (delete)="onDeleteProduct($event)">
        </app-product-card>

      </div>

    </section>

  </ng-container>


  <!-- PRODUCT DETAILS -->
  <app-product-details
    *ngIf="isDetailOpen && selectedProduct as product"
    [product]="product"
    (back)="onBackToList()"
    (editProduct)="onEditProduct($event)"
    (deleteProduct)="onDeleteProduct($event)">
  </app-product-details>


  <!-- PRODUCT FORM -->
  <app-product-form
    *ngIf="showForm"
    [product]="selectedProduct"
    (save)="onSaveProduct($event)"
    (cancel)="onCancelForm()">
  </app-product-form>

</main>
