
<aside
  class="sidebar d-flex flex-column"
  [class.collapsed]="collapsed"
  [class.mobile-open]="mobileOpen">

  <div class="brand d-flex align-items-center gap-3 p-3 border-bottom">
    <div class="brand-mark">
      <img
        src="/images/logo-optimized.png"
        alt="My Warranty Logo"
        class="logo">
    </div>

    <div class="brand-info">
      <div class="brand-name">My Warranty</div>
      <div class="brand-sub">Warranty Tracker</div>
    </div>
  </div>

  <nav class="nav-list flex-grow-1 p-2">
    @for (section of sections; track section.label) {
      @for (item of section.items; track item.label) {
        <a
          class="nav-item d-flex align-items-center gap-3"
          [routerLink]="item.route"
          routerLinkActive="active"
          (click)="closeMobileMenu.emit()">

          <span class="icon">
            <i [class]="item.icon"></i>
          </span>

          <span class="label">{{ item.label }}</span>

          @if (badgeCounts[item.label]) {
            <span class="nav-badge">
              {{ badgeCounts[item.label] }}
            </span>
          }
        </a>
      }
    }
  </nav>

  <div class="sidebar-user d-flex align-items-center gap-2 p-3 border-top">
    <div class="user-avatar">A</div>

    <div class="user-info">
      <div class="u-name">user</div>
      <div class="u-email">you&#64;example.com</div>
    </div>
  </div>

  <a class="logout-link d-flex align-items-center gap-2 px-3 pb-3">
    <i class="bi bi-box-arrow-right"></i>
    <span class="label">Logout</span>
  </a>

</aside>
